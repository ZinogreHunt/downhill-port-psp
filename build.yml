name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dengan image pspdev
        run: |
          docker run --rm -v "$PWD":/src -w /src pspdev/pspdev \
            sh -c "(apk add --no-cache make gmp mpc1 mpfr4 || true) && make"
      - uses: actions/upload-artifact@v4
        with:
          name: EBOOT
          path: EBOOT.PBP
